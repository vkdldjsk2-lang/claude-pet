name: Release

# v* 태그를 밀면 Windows/macOS 설치 파일을 만들어 릴리스에 올린다.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --win
          - name: macOS
            os: macos-latest
            args: --mac

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run make-icon

      # 실패하면 로그 꼬리를 애너테이션으로 남긴다.
      # 저장소 로그는 로그인해야 보이지만 애너테이션은 공개 API 로 읽히므로,
      # 빌드가 왜 깨졌는지 밖에서도 바로 확인할 수 있다.
      - name: Build and publish
        shell: bash
        run: |
          set -o pipefail
          if ! npx electron-builder ${{ matrix.args }} --publish always 2>&1 | tee build.log; then
            echo "::error title=electron-builder failed::$(tail -c 2500 build.log | tr '\r\n' '  ')"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 코드 서명 인증서가 없다. 서명 없이 빌드한다.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.name }}
          path: build.log
          retention-days: 7
